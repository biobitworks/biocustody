[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biocustody-stateshift"
version = "0.2.0"
description = "Variance-aware scientific custody and counter-perturbation MVP"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "networkx>=3.3",
  "rfc8785>=0.1.4",
  "jsonschema>=4.23",
  "pydantic>=2.8",
  "bibtexparser==1.4.4",
]

[project.optional-dependencies]
fcg-core-dev = [
  "pytest>=8.2",
  "hypothesis>=6.112",
]
demo = [
  "streamlit>=1.37",
  "matplotlib>=3.9",
  "openai>=3.0.0",
  "pytest>=8.2",
  "python-dotenv>=1.0"
]
chem = [
  "rdkit>=2024.3"
]
voice = [
  "elevenlabs>=1.0",
  "python-dotenv>=1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "tests/fcg_core"]
